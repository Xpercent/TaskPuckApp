name: Build iOS IPA (SwiftUI)

on:
  push:
    branches: [ "main", "release/*" ]
  workflow_dispatch:

jobs:
  build-apple-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Show Xcode Version Info
        run: xcodebuild -version

      # 如果仓库中没有 .xcodeproj，自动安装 xcodegen 并现场生成 Xcode 工程
      - name: Generate Xcode Project if missing
        run: |
          if [ ! -d "TaskPuckApp.xcodeproj" ]; then
            echo "TaskPuckApp.xcodeproj not found, installing xcodegen..."
            brew install xcodegen
            xcodegen generate
          fi

      - name: Build Archive (.xcarchive)
        run: |
          xcodebuild archive \
            -project TaskPuckApp.xcodeproj \
            -scheme TaskPuckApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/TaskPuckApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export IPA (Unsigned / Ad-Hoc)
        run: |
          mkdir -p $RUNNER_TEMP/Export
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/TaskPuckApp.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r TaskPuckApp.ipa Payload
          mv TaskPuckApp.ipa $RUNNER_TEMP/Export/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskPuckApp-iOS-IPA
          path: ${{ runner.temp }}/Export/TaskPuckApp.ipa
          if-no-files-found: error