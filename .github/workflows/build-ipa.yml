name: Build iOS IPA (SwiftUI)

on:
  push:
    branches: ["main", "release/*"]
  workflow_dispatch:

jobs:
  build-apple-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Show Xcode Version Info
        run: xcodebuild -version

      - name: Generate Xcode Project if missing
        run: |
          if [ ! -d "TaskPuckApp.xcodeproj" ]; then
            echo "TaskPuckApp.xcodeproj not found, installing xcodegen..."
            brew install xcodegen
            xcodegen generate
          fi

      - name: Build Archive (.xcarchive)
        run: |
          xcodebuild archive \
            -project TaskPuckApp.xcodeproj \
            -scheme TaskPuckApp \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/TaskPuckApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Export IPA (Unsigned / Ad-Hoc)
        run: |
          # 1. 彻底清理临时目录，防止残余文件污染 Payload
          rm -rf $RUNNER_TEMP/Export $RUNNER_TEMP/Payload $RUNNER_TEMP/TaskPuckApp.ipa

          mkdir -p $RUNNER_TEMP/Export
          mkdir -p $RUNNER_TEMP/Payload

          # 2. 使用 cp -a 代替 cp -r，完全保留文件属性与软链接
          cp -a $RUNNER_TEMP/TaskPuckApp.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/

          cd $RUNNER_TEMP
          # 3. 核心修复：添加 -y 参数保存软链接 (Symlinks)，防止生成损坏的 IPA
          zip -ry TaskPuckApp.ipa Payload

          mv TaskPuckApp.ipa $RUNNER_TEMP/Export/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskPuckApp-iOS-IPA
          path: ${{ runner.temp }}/Export/TaskPuckApp.ipa
          if-no-files-found: error
