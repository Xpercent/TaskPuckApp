name: Build iOS IPA (SwiftUI)

on:
  push:
    branches: ["main", "release/*"]
  workflow_dispatch:

jobs:
  build-apple-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Show Xcode Version Info
        run: xcodebuild -version

      - name: Generate Xcode Project
        run: |
          echo "Installing xcodegen and generating project..."
          brew install xcodegen
          xcodegen generate

      - name: Build Archive (.xcarchive)
        run: |
          xcodebuild archive \
            -project TaskPuckApp.xcodeproj \
            -scheme TaskPuckApp \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/TaskPuckApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Export IPA (Unsigned / Ad-Hoc)
        run: |
          # 1. 彻底清理临时目录
          rm -rf $RUNNER_TEMP/Export $RUNNER_TEMP/Payload $RUNNER_TEMP/TaskPuckApp.ipa

          mkdir -p $RUNNER_TEMP/Export
          mkdir -p $RUNNER_TEMP/Payload

          # 2. 复制 app 包到 Payload 目录
          cp -a $RUNNER_TEMP/TaskPuckApp.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/

          cd $RUNNER_TEMP
          # 3. 递归打包
          zip -r TaskPuckApp.ipa Payload

          # 4. 校验 IPA 目录结构
          zipinfo -1 TaskPuckApp.ipa | grep -Eq '^Payload/[^/]+\.app/Info\.plist$'

          # 5. 深度校验：校验 LiveContainer 必须的 CFBundleExecutable 是否已正确展开
          EXEC_NAME=$(unzip -p TaskPuckApp.ipa "Payload/*.app/Info.plist" | plutil -extract CFBundleExecutable raw -)
          echo "Parsed CFBundleExecutable: $EXEC_NAME"
          if [ "$EXEC_NAME" = "\$(EXECUTABLE_NAME)" ] || [ -z "$EXEC_NAME" ]; then
            echo "错误：Info.plist 里的 CFBundleExecutable 含有未展开的占位符！"
            exit 1
          fi

          mv TaskPuckApp.ipa $RUNNER_TEMP/Export/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskPuckApp-iOS-IPA-unzip-first
          path: ${{ runner.temp }}/Export/TaskPuckApp.ipa
          if-no-files-found: error
