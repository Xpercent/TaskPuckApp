name: TaskPuckApp
options:
  bundleIdPrefix: com.taskpuck
  deploymentTarget:
    iOS: "17.0"
targets:
  TaskPuckApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TaskPuckApp
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.taskpuck.app
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"